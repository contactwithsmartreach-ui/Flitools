<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Studio — Convert Markdown & HTML Locally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<!-- Monetag Vignette / Interstitial Tag Script -->
<script>(function(s){s.dataset.zone='11579038',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<style>
  :root{ --ease: cubic-bezier(0.16, 1, 0.3, 1); }
  *{ font-family: 'Inter', sans-serif; }
  body{ background:#080314; color:#ffffff; }
  .mono{ font-family: 'JetBrains Mono', monospace; }

  @keyframes fadeSlideDown{ from{ opacity:0; transform: translateY(-16px); } to{ opacity:1; transform: translateY(0); } }
  @keyframes fadeSlideUp{ from{ opacity:0; transform: translateY(20px); } to{ opacity:1; transform: translateY(0); } }
  .anim-navbar{ animation: fadeSlideDown 0.8s var(--ease) both; }
  .anim-content{ animation: fadeSlideUp 0.8s var(--ease) both; }

  textarea{ transition: border-color .15s ease; background:#1a0836; color:#ffffff; }
  textarea:focus{ outline:none; border-color:#c084fc; }

  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background: rgba(15, 5, 29, 0.6); }
  ::-webkit-scrollbar-thumb{ background: rgba(168, 85, 247, 0.4); border-radius:9999px; }

  .tab-btn{ transition: background-color .15s ease, color .15s ease; }
  .seg-btn{ transition: background-color .15s ease, color .15s ease; }

  .prose-preview h1{ font-size:1.5rem; font-weight:700; margin:.6em 0 .3em; color:#fff; }
  .prose-preview h2{ font-size:1.25rem; font-weight:600; margin:.6em 0 .3em; color:#e9d5ff; }
  .prose-preview h3{ font-size:1.1rem; font-weight:600; margin:.5em 0 .3em; color:#d8b4fe; }
  .prose-preview p{ margin:.5em 0; line-height:1.6; color:#f3e8ff; }
  .prose-preview ul, .prose-preview ol{ margin:.5em 0 .5em 1.4em; }
  .prose-preview li{ margin:.2em 0; line-height:1.6; color:#f3e8ff; }
  .prose-preview a{ color:#c084fc; text-decoration:underline; }
  .prose-preview code{ background:#2e1065; color:#e9d5ff; padding:.1em .35em; border-radius:.3em; font-family:'JetBrains Mono',monospace; font-size:.85em; }
  .prose-preview pre{ background:#1f0747; padding:.8em 1em; border-radius:.6em; overflow-x:auto; margin:.6em 0; }
  .prose-preview pre code{ background:none; padding:0; }
  .prose-preview blockquote{ border-left:3px solid #a855f7; padding-left:1em; color:#d8b4fe; margin:.6em 0; }
</style>
</head>
<body class="min-h-screen flex flex-col bg-[#080314] text-white">

  <!-- NAVBAR -->
  <nav class="anim-navbar relative z-50 flex items-center justify-between px-4 py-3 md:px-8 border-b border-purple-900/40 bg-[#0d0422]/90 backdrop-blur-md">
    <div class="flex items-center gap-3">
      <a href="/" class="flex items-center gap-2">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <rect x="5" y="4" width="6" height="14" rx="2.5" fill="#e9d5ff" transform="rotate(-35 8 11)" />
          <rect x="12" y="4" width="6" height="14" rx="2.5" fill="#c084fc" transform="rotate(-35 15 11)" />
        </svg>
        <span class="font-semibold text-sm tracking-tight text-white">FliTools</span>
      </a>
      <span class="text-purple-400/40 text-xs">/</span>
      <span class="text-xs text-purple-200 font-medium">Markdown Studio</span>
      <span class="hidden sm:inline bg-purple-950/80 border border-purple-400/30 text-purple-200 text-[10px] uppercase font-semibold px-2 py-0.5 rounded-full">
        100% Client-Side
      </span>
    </div>
  </nav>

  <!-- TOOL -->
  <section class="anim-content w-full max-w-6xl mx-auto px-4 md:px-8 py-8 flex-1 flex flex-col">

    <div class="mb-8 border-b border-purple-900/40 pb-5">
      <h1 class="text-2xl md:text-3xl font-light tracking-tight text-white mb-1">Convert Markdown & HTML</h1>
      <p class="text-xs text-purple-200/70">Convert between Markdown and sanitized HTML with live rendered preview.</p>
    </div>

    <div class="flex rounded-xl overflow-hidden border border-purple-400/20 text-xs mb-8 w-fit bg-purple-950/60 p-1">
      <button data-direction="md2html" class="tab-btn dir-tab px-6 py-2 rounded-lg bg-gradient-to-r from-purple-700 to-indigo-600 text-white font-medium shadow-md">Markdown → HTML</button>
      <button data-direction="html2md" class="tab-btn dir-tab px-6 py-2 rounded-lg text-purple-300 hover:text-white font-medium">HTML → Markdown</button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

      <!-- LEFT: input -->
      <div class="flex flex-col gap-6">
        <div class="bg-[#12052b]/90 border border-purple-300/20 rounded-2xl p-5 shadow-xl">
          <h3 class="text-xs font-bold uppercase tracking-wider text-purple-200 mb-3" id="inputLabel">1. Paste Markdown</h3>
          <textarea id="sourceInput" spellcheck="false" class="mono w-full h-72 border border-purple-400/20 rounded-xl p-3.5 text-xs leading-relaxed resize-none"></textarea>
        </div>

        <div class="bg-[#12052b]/90 border border-purple-300/20 rounded-2xl p-5 shadow-xl flex items-center justify-between">
          <label class="text-xs text-purple-200/80" id="optionLabel">Show live rendered preview</label>
          <input id="livePreviewToggle" type="checkbox" checked class="accent-purple-500 w-4 h-4 cursor-pointer">
        </div>
      </div>

      <!-- RIGHT: output -->
      <div class="flex flex-col gap-6">
        <div class="bg-[#12052b]/90 border border-purple-300/20 rounded-2xl p-5 shadow-xl flex-1 flex flex-col">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-xs font-bold uppercase tracking-wider text-purple-200" id="outputLabel">3. HTML Output</h3>
            <div class="flex rounded-lg overflow-hidden border border-purple-400/20 text-xs bg-purple-950/60 p-0.5" id="outputViewToggle">
              <button data-view="code" class="seg-btn view-btn px-3 py-1 rounded-md bg-purple-700 text-white font-medium">Code</button>
              <button data-view="preview" class="seg-btn view-btn px-3 py-1 rounded-md text-purple-300 hover:text-white">Preview</button>
            </div>
          </div>
          <pre id="codeOutput" class="mono w-full h-72 border border-purple-400/20 rounded-xl p-3.5 text-xs leading-relaxed overflow-auto bg-[#0a0218] text-purple-100 flex-1"><span class="text-purple-300/40">Converted output will appear here</span></pre>
          <div id="previewOutput" class="prose-preview hidden w-full h-72 border border-purple-400/20 rounded-xl p-4 text-xs overflow-auto bg-[#0a0218] flex-1"></div>
        </div>

        <div class="bg-[#12052b]/90 border border-purple-300/20 rounded-2xl p-5 shadow-xl flex flex-col gap-3">
          <h3 class="text-xs font-bold uppercase tracking-wider text-purple-200">4. Export</h3>
          <div class="flex gap-3">
            <button id="copyBtn" class="pointer-events-none opacity-30 flex-1 bg-purple-950/60 hover:bg-purple-900/80 border border-purple-400/30 text-white text-xs font-medium rounded-xl py-2.5 cursor-pointer">Copy to Clipboard</button>
            <a id="downloadBtn" class="pointer-events-none opacity-30 flex-1 bg-gradient-to-r from-purple-700 to-indigo-600 hover:from-purple-600 hover:to-indigo-500 text-white text-xs font-semibold rounded-xl py-2.5 text-center cursor-pointer shadow-md">Download</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="text-center text-[11px] text-purple-400/50 py-4 border-t border-purple-900/30 bg-[#080314]">
    FliTools — 100% Client-Side Markdown Converter
  </footer>

<script>
(function(){
  const DIRECT_LINK_URL = 'https://omg10.com/4/11580632';

  const dirTabs = document.querySelectorAll('.dir-tab');
  const sourceInput = document.getElementById('sourceInput');
  const inputLabel = document.getElementById('inputLabel');
  const outputLabel = document.getElementById('outputLabel');
  const codeOutput = document.getElementById('codeOutput');
  const previewOutput = document.getElementById('previewOutput');
  const viewBtns = document.querySelectorAll('.view-btn');
  const outputViewToggle = document.getElementById('outputViewToggle');
  const optionLabel = document.getElementById('optionLabel');
  const livePreviewToggle = document.getElementById('livePreviewToggle');
  const copyBtn = document.getElementById('copyBtn');
  const downloadBtn = document.getElementById('downloadBtn');

  let direction = 'md2html';
  let currentView = 'code';
  let lastResult = '';
  let marked = null, TurndownService = null;
  let debounceTimer = null;

  const sampleMd = `# Hello world

Type or paste **Markdown** here…

- Item one
- Item two

[A link](https://flitools.cyou)`;
  const sampleHtml = `<h1>Hello world</h1>
<p>Paste <strong>HTML</strong> here…</p>
<ul>
  <li>Item one</li>
  <li>Item two</li>
</ul>
<p><a href="https://flitools.cyou">A link</a></p>`;

  sourceInput.value = sampleMd;

  dirTabs.forEach(btn => {
    btn.addEventListener('click', () => {
      dirTabs.forEach(b => {
        b.classList.remove('bg-gradient-to-r','from-purple-700','to-indigo-600','text-white','shadow-md');
        b.classList.add('text-purple-300');
      });
      btn.classList.add('bg-gradient-to-r','from-purple-700','to-indigo-600','text-white','shadow-md');
      btn.classList.remove('text-purple-300');
      direction = btn.dataset.direction;
      if (direction === 'md2html') {
        inputLabel.textContent = '1. Paste Markdown';
        outputLabel.textContent = '3. HTML Output';
        sourceInput.placeholder = 'Type or paste Markdown here…';
        sourceInput.value = sampleMd;
        outputViewToggle.classList.remove('hidden');
        optionLabel.textContent = 'Show live rendered preview';
      } else {
        inputLabel.textContent = '1. Paste HTML';
        outputLabel.textContent = '3. Markdown Output';
        sourceInput.placeholder = 'Paste HTML here…';
        sourceInput.value = sampleHtml;
        outputViewToggle.classList.add('hidden');
        setView('code');
        optionLabel.textContent = 'Auto-convert as you type';
      }
      convert();
    });
  });

  viewBtns.forEach(btn => {
    btn.addEventListener('click', () => setView(btn.dataset.view));
  });
  function setView(view){
    currentView = view;
    viewBtns.forEach(b => b.classList.toggle('bg-purple-700', b.dataset.view === view));
    viewBtns.forEach(b => b.classList.toggle('text-white', b.dataset.view === view));
    codeOutput.classList.toggle('hidden', view !== 'code');
    previewOutput.classList.toggle('hidden', view !== 'preview');
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');
  }

  sourceInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(convert, 200);
  });
  livePreviewToggle.addEventListener('change', convert);

  async function convert(){
    const src = sourceInput.value;
    if (!src.trim()) {
      codeOutput.innerHTML = '<span class="text-purple-300/40">Converted output will appear here</span>';
      previewOutput.innerHTML = '';
      copyBtn.classList.add('pointer-events-none','opacity-30');
      downloadBtn.classList.add('pointer-events-none','opacity-30');
      return;
    }

    try {
      if (direction === 'md2html') {
        if (!marked) {
          const mod = await import('https://cdn.jsdelivr.net/npm/marked@12.0.2/+esm');
          marked = mod.marked || mod.default;
        }
        const html = marked.parse(src);
        lastResult = html;
        codeOutput.textContent = html;
        if (livePreviewToggle.checked) {
          previewOutput.innerHTML = html;
          setView('preview');
        } else {
          setView('code');
        }
        downloadBtn.download = 'converted.html';
      } else {
        if (!TurndownService) {
          const mod = await import('https://cdn.jsdelivr.net/npm/turndown@7.2.0/+esm');
          TurndownService = mod.default || mod;
        }
        const service = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced' });
        const md = service.turndown(src);
        lastResult = md;
        codeOutput.textContent = md;
        downloadBtn.download = 'converted.md';
      }

      const mime = direction === 'md2html' ? 'text/html' : 'text/markdown';
      downloadBtn.href = URL.createObjectURL(new Blob([lastResult], { type: mime }));
      copyBtn.classList.remove('pointer-events-none','opacity-30');
      downloadBtn.classList.remove('pointer-events-none','opacity-30');
    } catch (err) {
      console.error(err);
      codeOutput.innerHTML = '<span class="text-red-400">Conversion error: ' + escapeHtml(err.message) + '</span>';
    }
  }

  copyBtn.addEventListener('click', async () => {
    if (!lastResult) return;
    window.open(DIRECT_LINK_URL, '_blank');
    await navigator.clipboard.writeText(lastResult);
    const orig = copyBtn.textContent;
    copyBtn.textContent = 'Copied!';
    setTimeout(() => copyBtn.textContent = orig, 1200);
  });

  downloadBtn.addEventListener('click', () => {
    window.open(DIRECT_LINK_URL, '_blank');
  });

  convert();
})();
</script>
</body>
</html>
