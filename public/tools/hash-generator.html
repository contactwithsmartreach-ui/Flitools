<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hash Studio — Generate SHA Hashes Locally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<!-- Monetag Vignette / Interstitial Tag Script -->
<script>(function(s){s.dataset.zone='11579038',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<style>
  :root{ --ease: cubic-bezier(0.16, 1, 0.3, 1); }
  *{ font-family: 'Inter', sans-serif; }
  body{ background:#080314; color:#ffffff; }
  .mono{ font-family: 'JetBrains Mono', monospace; }

  @keyframes fadeSlideDown{ from{ opacity:0; transform: translateY(-16px); } to{ opacity:1; transform: translateY(0); } }
  @keyframes fadeSlideUp{ from{ opacity:0; transform: translateY(20px); } to{ opacity:1; transform: translateY(0); } }
  .anim-navbar{ animation: fadeSlideDown 0.8s var(--ease) both; }
  .anim-content{ animation: fadeSlideUp 0.8s var(--ease) both; }

  textarea{ transition: border-color .15s ease; background:#1a0836; color:#ffffff; }
  textarea:focus{ outline:none; border-color:#c084fc; }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background: rgba(15, 5, 29, 0.6); }
  ::-webkit-scrollbar-thumb{ background: rgba(168, 85, 247, 0.4); border-radius:9999px; }
</style>
</head>
<body class="min-h-screen flex flex-col bg-[#080314] text-white">

  <!-- NAVBAR -->
  <nav class="anim-navbar relative z-50 flex items-center justify-between px-4 py-3 md:px-8 border-b border-purple-900/40 bg-[#0d0422]/90 backdrop-blur-md">
    <div class="flex items-center gap-3">
      <a href="/" class="flex items-center gap-2">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <rect x="5" y="4" width="6" height="14" rx="2.5" fill="#e9d5ff" transform="rotate(-35 8 11)" />
          <rect x="12" y="4" width="6" height="14" rx="2.5" fill="#c084fc" transform="rotate(-35 15 11)" />
        </svg>
        <span class="font-semibold text-sm tracking-tight text-white">FliTools</span>
      </a>
      <span class="text-purple-400/40 text-xs">/</span>
      <span class="text-xs text-purple-200 font-medium">Hash Studio</span>
      <span class="hidden sm:inline bg-purple-950/80 border border-purple-400/30 text-purple-200 text-[10px] uppercase font-semibold px-2 py-0.5 rounded-full">
        100% Client-Side
      </span>
    </div>
  </nav>

  <!-- TOOL -->
  <section class="anim-content w-full max-w-6xl mx-auto px-4 md:px-8 py-8 flex-1 flex flex-col">

    <div class="mb-8 border-b border-purple-900/40 pb-5">
      <h1 class="text-2xl md:text-3xl font-light tracking-tight text-white mb-1">Generate Hashes & Checksums</h1>
      <p class="text-xs text-purple-200/70">Compute cryptographic hashes (SHA-256, SHA-512, SHA-1) directly in hardware via Web Crypto API.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <div class="bg-[#12052b]/90 border border-purple-300/20 rounded-2xl p-5 shadow-xl flex flex-col gap-3">
        <h3 class="text-xs font-bold uppercase tracking-wider text-purple-200">1. Input Text</h3>
        <textarea id="inputTxt" spellcheck="false" placeholder="Type or paste text here..." class="mono w-full h-72 border border-purple-400/20 rounded-xl p-3.5 text-xs leading-relaxed resize-none">Hello World!</textarea>
      </div>

      <div class="bg-[#12052b]/90 border border-purple-300/20 rounded-2xl p-5 shadow-xl flex flex-col gap-4">
        <h3 class="text-xs font-bold uppercase tracking-wider text-purple-200">2. Computed Hashes</h3>
        
        <div class="border border-purple-400/20 rounded-xl p-3.5 bg-[#0a0218] flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-purple-200">SHA-256</span>
            <button data-target="hash256" class="copy-btn text-[10px] rounded-lg px-2.5 py-1 border border-purple-400/30 bg-purple-900/40 hover:bg-purple-600 text-white transition-colors cursor-pointer">Copy</button>
          </div>
          <pre id="hash256" class="mono text-xs text-purple-100 break-all whitespace-pre-wrap select-all">—</pre>
        </div>

        <div class="border border-purple-400/20 rounded-xl p-3.5 bg-[#0a0218] flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-purple-200">SHA-512</span>
            <button data-target="hash512" class="copy-btn text-[10px] rounded-lg px-2.5 py-1 border border-purple-400/30 bg-purple-900/40 hover:bg-purple-600 text-white transition-colors cursor-pointer">Copy</button>
          </div>
          <pre id="hash512" class="mono text-xs text-purple-100 break-all whitespace-pre-wrap select-all">—</pre>
        </div>

        <div class="border border-purple-400/20 rounded-xl p-3.5 bg-[#0a0218] flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-purple-200">SHA-1</span>
            <button data-target="hash1" class="copy-btn text-[10px] rounded-lg px-2.5 py-1 border border-purple-400/30 bg-purple-900/40 hover:bg-purple-600 text-white transition-colors cursor-pointer">Copy</button>
          </div>
          <pre id="hash1" class="mono text-xs text-purple-100 break-all whitespace-pre-wrap select-all">—</pre>
        </div>
      </div>
    </div>
  </section>

  <footer class="text-center text-[11px] text-purple-400/50 py-4 border-t border-purple-900/30 bg-[#080314]">
    FliTools — 100% Client-Side Cryptographic Hash Studio
  </footer>

<script>
(function(){
  const DIRECT_LINK_URL = 'https://omg10.com/4/11580632';

  const inputTxt = document.getElementById('inputTxt');
  const h256 = document.getElementById('hash256');
  const h512 = document.getElementById('hash512');
  const h1 = document.getElementById('hash1');

  async function computeHash(message, algorithm){
    const msgUint8 = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest(algorithm, msgUint8);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function updateHashes(){
    const val = inputTxt.value;
    if (!val) {
      h256.textContent = '—';
      h512.textContent = '—';
      h1.textContent = '—';
      return;
    }
    try {
      h256.textContent = await computeHash(val, 'SHA-256');
      h512.textContent = await computeHash(val, 'SHA-512');
      h1.textContent = await computeHash(val, 'SHA-1');
    } catch(err) {
      h256.textContent = 'Error: ' + err.message;
    }
  }

  inputTxt.addEventListener('input', updateHashes);

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      window.open(DIRECT_LINK_URL, '_blank');
      const targetId = btn.dataset.target;
      const text = document.getElementById(targetId).textContent;
      if (text && text !== '—') {
        await navigator.clipboard.writeText(text);
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1200);
      }
    });
  });

  updateHashes();
})();
</script>
</body>
</html>
