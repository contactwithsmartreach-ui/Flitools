<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encode Studio — Base64 & URL Encoder Locally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<!-- Monetag Vignette / Interstitial Tag Script -->
<script>(function(s){s.dataset.zone='11579038',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<style>
  :root{ --ease: cubic-bezier(0.16, 1, 0.3, 1); }
  *{ font-family: 'Inter', sans-serif; }
  body{ background:#080314; color:#ffffff; }
  .mono{ font-family: 'JetBrains Mono', monospace; }

  @keyframes fadeSlideDown{ from{ opacity:0; transform: translateY(-16px); } to{ opacity:1; transform: translateY(0); } }
  @keyframes fadeSlideUp{ from{ opacity:0; transform: translateY(20px); } to{ opacity:1; transform: translateY(0); } }
  .anim-navbar{ animation: fadeSlideDown 0.8s var(--ease) both; }
  .anim-content{ animation: fadeSlideUp 0.8s var(--ease) both; }

  textarea{ transition: border-color .15s ease; background:#1a0836; color:#ffffff; }
  textarea:focus{ outline:none; border-color:#c084fc; }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background: rgba(15, 5, 29, 0.6); }
  ::-webkit-scrollbar-thumb{ background: rgba(168, 85, 247, 0.4); border-radius:9999px; }
  .tab-btn{ transition: background-color .15s ease, color .15s ease; }
</style>
</head>
<body class="min-h-screen flex flex-col bg-[#080314] text-white">

  <!-- NAVBAR -->
  <nav class="anim-navbar relative z-50 flex items-center justify-between px-4 py-3 md:px-8 border-b border-purple-900/40 bg-[#0d0422]/90 backdrop-blur-md">
    <div class="flex items-center gap-3">
      <a href="/" class="flex items-center gap-2">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <rect x="5" y="4" width="6" height="14" rx="2.5" fill="#e9d5ff" transform="rotate(-35 8 11)" />
          <rect x="12" y="4" width="6" height="14" rx="2.5" fill="#c084fc" transform="rotate(-35 15 11)" />
        </svg>
        <span class="font-semibold text-sm tracking-tight text-white">FliTools</span>
      </a>
      <span class="text-purple-400/40 text-xs">/</span>
      <span class="text-xs text-purple-200 font-medium">Encode Studio</span>
      <span class="hidden sm:inline bg-purple-950/80 border border-purple-400/30 text-purple-200 text-[10px] uppercase font-semibold px-2 py-0.5 rounded-full">
        100% Client-Side
      </span>
    </div>
  </nav>

  <!-- TOOL -->
  <section class="anim-content w-full max-w-6xl mx-auto px-4 md:px-8 py-8 flex-1 flex flex-col">

    <div class="mb-8 border-b border-purple-900/40 pb-5">
      <h1 class="text-2xl md:text-3xl font-light tracking-tight text-white mb-1">Encode & Decode Strings</h1>
      <p class="text-xs text-purple-200/70">Convert data between plain text, Base64, and URL encoding instantly inside your browser.</p>
    </div>

    <div class="flex rounded-xl overflow-hidden border border-purple-400/20 text-xs mb-8 w-fit bg-purple-950/60 p-1">
      <button data-mode="b64enc" class="tab-btn mode-tab px-4 py-2 rounded-lg bg-gradient-to-r from-purple-700 to-indigo-600 text-white font-medium shadow-md">Base64 Encode</button>
      <button data-mode="b64dec" class="tab-btn mode-tab px-4 py-2 rounded-lg text-purple-300 hover:text-white font-medium">Base64 Decode</button>
      <button data-mode="urlenc" class="tab-btn mode-tab px-4 py-2 rounded-lg text-purple-300 hover:text-white font-medium">URL Encode</button>
      <button data-mode="urldec" class="tab-btn mode-tab px-4 py-2 rounded-lg text-purple-300 hover:text-white font-medium">URL Decode</button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <div class="bg-[#12052b]/90 border border-purple-300/20 rounded-2xl p-5 shadow-xl flex flex-col gap-3">
        <h3 class="text-xs font-bold uppercase tracking-wider text-purple-200" id="inputLabel">1. Input Text (Base64 Encode)</h3>
        <textarea id="inputTxt" spellcheck="false" placeholder="Type or paste text here..." class="mono w-full h-72 border border-purple-400/20 rounded-xl p-3.5 text-xs leading-relaxed resize-none">Hello World!</textarea>
      </div>

      <div class="bg-[#12052b]/90 border border-purple-300/20 rounded-2xl p-5 shadow-xl flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold uppercase tracking-wider text-purple-200">2. Output Result</h3>
          <button id="copyBtn" class="text-[11px] rounded-lg px-3 py-1.5 border border-purple-400/30 bg-purple-900/40 hover:bg-purple-600 text-white transition-colors pointer-events-none opacity-30 cursor-pointer">Copy Output</button>
        </div>
        <pre id="outputPre" class="mono w-full h-72 border border-purple-400/20 rounded-xl p-3.5 text-xs leading-relaxed overflow-auto bg-[#0a0218] text-purple-100 select-all">SGVsbG8gV29ybGQh</pre>
      </div>
    </div>
  </section>

  <footer class="text-center text-[11px] text-purple-400/50 py-4 border-t border-purple-900/30 bg-[#080314]">
    FliTools — 100% Client-Side Encode Studio
  </footer>

<script>
(function(){
  const DIRECT_LINK_URL = 'https://omg10.com/4/11580632';

  const tabs = document.querySelectorAll('.mode-tab');
  const inputTxt = document.getElementById('inputTxt');
  const outputPre = document.getElementById('outputPre');
  const inputLabel = document.getElementById('inputLabel');
  const copyBtn = document.getElementById('copyBtn');
  let mode = 'b64enc';

  tabs.forEach(t => {
    t.addEventListener('click', () => {
      tabs.forEach(b => {
        b.classList.remove('bg-gradient-to-r','from-purple-700','to-indigo-600','text-white','shadow-md');
        b.classList.add('text-purple-300');
      });
      t.classList.add('bg-gradient-to-r','from-purple-700','to-indigo-600','text-white','shadow-md');
      t.classList.remove('text-purple-300');
      mode = t.dataset.mode;
      inputLabel.textContent = '1. Input Text (' + t.textContent + ')';
      process();
    });
  });

  function process(){
    const val = inputTxt.value;
    if (!val) {
      outputPre.textContent = '';
      copyBtn.classList.add('pointer-events-none','opacity-30');
      return;
    }
    try {
      let res = '';
      if (mode === 'b64enc') res = btoa(unescape(encodeURIComponent(val)));
      else if (mode === 'b64dec') res = decodeURIComponent(escape(atob(val)));
      else if (mode === 'urlenc') res = encodeURIComponent(val);
      else if (mode === 'urldec') res = decodeURIComponent(val);

      outputPre.textContent = res;
      outputPre.className = 'mono w-full h-72 border border-purple-400/20 rounded-xl p-3.5 text-xs leading-relaxed overflow-auto bg-[#0a0218] text-purple-100 select-all';
      copyBtn.classList.remove('pointer-events-none','opacity-30');
    } catch(err) {
      outputPre.textContent = 'Error: ' + err.message;
      outputPre.className = 'mono w-full h-72 border border-red-500/40 rounded-xl p-3.5 text-xs leading-relaxed overflow-auto bg-red-950/30 text-red-400';
      copyBtn.classList.add('pointer-events-none','opacity-30');
    }
  }

  inputTxt.addEventListener('input', process);
  copyBtn.addEventListener('click', async () => {
    window.open(DIRECT_LINK_URL, '_blank');
    await navigator.clipboard.writeText(outputPre.textContent);
    const orig = copyBtn.textContent;
    copyBtn.textContent = 'Copied!';
    setTimeout(() => copyBtn.textContent = orig, 1200);
  });
  process();
})();
</script>
</body>
</html>
