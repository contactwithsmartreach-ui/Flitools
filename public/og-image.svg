<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#4b1e85" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#080314" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#7e22ce" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#080314" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2e1065" stop-opacity="0.8"/>
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#2e1065" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e0a38" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Text & Border Gradients -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7e22ce" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Base Background -->
  <rect width="1200" height="630" fill="#080314"/>
  <rect width="1200" height="630" fill="url(#bgGlow1)"/>
  <rect width="1200" height="630" fill="url(#bgGlow2)"/>

  <!-- Decorative Cosmic Grid Pattern Lines -->
  <path d="M0 100H1200 M0 200H1200 M0 300H1200 M0 400H1200 M0 500H1200" stroke="#a855f7" stroke-opacity="0.05" stroke-width="1"/>
  <path d="M200 0V630 M400 0V630 M600 0V630 M800 0V630 M1000 0V630" stroke="#a855f7" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Glowing background ambient light behind title -->
  <circle cx="320" cy="315" r="220" fill="#7e22ce" opacity="0.2" filter="url(#glow)"/>
  <circle cx="860" cy="315" r="260" fill="#a855f7" opacity="0.15" filter="url(#glow)"/>

  <!-- LEFT SECTION: Branding & Value Proposition -->

  <!-- Top Pill Badge: Zero Server Uploads -->
  <g transform="translate(80, 85)">
    <rect width="360" height="38" rx="19" fill="url(#pillBg)" stroke="url(#purpleBorder)" stroke-width="1.5"/>
    <circle cx="24" cy="19" r="5" fill="#38bdf8"/>
    <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#e0f2fe" letter-spacing="1.2">
      100% CLIENT-SIDE • ZERO UPLOADS
    </text>
  </g>

  <!-- Brand Logo & Title Group -->
  <g transform="translate(80, 160)">
    <!-- FliTools Icon (Matching Navbar branding) -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="68" height="68" rx="20" fill="#2e1065" stroke="url(#purpleBorder)" stroke-width="2" filter="url(#shadow)"/>
      <!-- Icon Tilted Capsules -->
      <g transform="translate(18, 14)">
        <rect x="2" y="4" width="12" height="32" rx="6" fill="#e9d5ff" transform="rotate(-35 8 20)"/>
        <rect x="18" y="4" width="12" height="32" rx="6" fill="#c084fc" transform="rotate(-35 24 20)"/>
      </g>
    </g>

    <!-- FliTools Wordmark -->
    <text x="92" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="64" font-weight="800" fill="url(#titleGradient)" letter-spacing="-1.5">
      FliTools
    </text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 285)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="44" font-weight="300" fill="#ffffff" letter-spacing="-1">
      Free Browser Digital
    </text>
    <text y="52" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="44" font-weight="700" fill="#f3e8ff" letter-spacing="-1">
      Utilities & Media Tools
    </text>
  </g>

  <!-- Description Body -->
  <text x="80" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18" font-weight="400" fill="#d8b4fe" opacity="0.9" width="480">
    Process GIFs, compress photos, split PDFs, trim waveforms,
  </text>
  <text x="80" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18" font-weight="400" fill="#d8b4fe" opacity="0.9">
    and format JSON instantly — with 100% private execution.
  </text>

  <!-- Feature Pills Footer -->
  <g transform="translate(80, 485)">
    <!-- Pill 1: Private -->
    <rect width="130" height="36" rx="18" fill="#2e1065" stroke="url(#purpleBorder)" stroke-width="1"/>
    <text x="20" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#f3e8ff">
      🔒 100% Private
    </text>

    <!-- Pill 2: Fast -->
    <rect x="142" width="130" height="36" rx="18" fill="#2e1065" stroke="url(#purpleBorder)" stroke-width="1"/>
    <text x="162" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#f3e8ff">
      ⚡ Ultra Fast
    </text>

    <!-- Pill 3: Free -->
    <rect x="284" width="125" height="36" rx="18" fill="#2e1065" stroke="url(#purpleBorder)" stroke-width="1"/>
    <text x="304" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#f3e8ff">
      ✨ 100% Free
    </text>
  </g>


  <!-- RIGHT SECTION: Showcase Tool Directory Glass Cards -->
  <g transform="translate(640, 85)" filter="url(#shadow)">

    <!-- Big Glass Card Container -->
    <rect width="480" height="460" rx="28" fill="url(#cardBg)" stroke="url(#purpleBorder)" stroke-width="2"/>
    <rect width="480" height="460" rx="28" fill="url(#cardGlow)"/>

    <!-- Header bar inside card -->
    <g transform="translate(32, 32)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#c084fc" letter-spacing="1.5">
        BROWSER-NATIVE DIRECTORY
      </text>
      <text y="28" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="700" fill="#ffffff">
        Included Utilities
      </text>
    </g>

    <!-- Tool Items Grid (2 columns x 3 rows) -->

    <!-- Tool 1: Video to GIF -->
    <g transform="translate(32, 105)">
      <rect width="198" height="92" rx="16" fill="#1e0a38" stroke="url(#purpleBorder)" stroke-width="1"/>
      <text x="16" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20">🎥</text>
      <text x="48" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Video to GIF</text>
      <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#a855f7">Convert clips locally</text>
      <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#cbd5e1">Custom FPS & trim</text>
    </g>

    <!-- Tool 2: Image Compressor -->
    <g transform="translate(250, 105)">
      <rect width="198" height="92" rx="16" fill="#1e0a38" stroke="url(#purpleBorder)" stroke-width="1"/>
      <text x="16" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20">🖼️</text>
      <text x="48" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Image Shrinker</text>
      <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#a855f7">Batch compression</text>
      <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#cbd5e1">JPG / WebP / PNG</text>
    </g>

    <!-- Tool 3: PDF Split & Merge -->
    <g transform="translate(32, 212)">
      <rect width="198" height="92" rx="16" fill="#1e0a38" stroke="url(#purpleBorder)" stroke-width="1"/>
      <text x="16" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20">📑</text>
      <text x="48" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">PDF Studio</text>
      <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#a855f7">Merge & split pages</text>
      <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#cbd5e1">No file uploads</text>
    </g>

    <!-- Tool 4: Waveform Trimmer -->
    <g transform="translate(250, 212)">
      <rect width="198" height="92" rx="16" fill="#1e0a38" stroke="url(#purpleBorder)" stroke-width="1"/>
      <text x="16" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20">🎙️</text>
      <text x="48" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Audio Trimmer</text>
      <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#a855f7">Waveform editor</text>
      <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#cbd5e1">Record & export WAV</text>
    </g>

    <!-- Tool 5: JSON Formatter -->
    <g transform="translate(32, 319)">
      <rect width="198" height="92" rx="16" fill="#1e0a38" stroke="url(#purpleBorder)" stroke-width="1"/>
      <text x="16" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20">⚡</text>
      <text x="48" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">JSON Studio</text>
      <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#a855f7">Format & validate</text>
      <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#cbd5e1">Syntax error locator</text>
    </g>

    <!-- Tool 6: QR & Passwords -->
    <g transform="translate(250, 319)">
      <rect width="198" height="92" rx="16" fill="#1e0a38" stroke="url(#purpleBorder)" stroke-width="1"/>
      <text x="16" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20">🔑</text>
      <text x="48" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Security Tools</text>
      <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#a855f7">QR & Passwords</text>
      <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#cbd5e1">Web Crypto powered</text>
    </g>
  </g>

  <!-- URL Branding Tag Bottom Right -->
  <text x="1120" y="590" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="700" fill="#c084fc" text-anchor="end" letter-spacing="0.5">
    flitools.cyou
  </text>
</svg>