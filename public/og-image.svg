<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#080314"/>
  
  <!-- Radial Background Glow -->
  <circle cx="600" cy="315" r="420" fill="#4b1e85" opacity="0.4"/>
  <circle cx="600" cy="315" r="260" fill="#7e22ce" opacity="0.25"/>

  <!-- Subtle grid lines -->
  <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200" stroke="#7e22ce" stroke-opacity="0.1" stroke-width="1"/>
  <path d="M200 0V630M400 0V630M600 0V630M800 0V630M1000 0V630" stroke="#7e22ce" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Content Container -->
  <g transform="translate(100, 130)">
    <!-- Brand Logo -->
    <g transform="translate(0, 0)">
      <rect width="64" height="64" rx="18" fill="#2d0f55" stroke="#a855f7" stroke-width="2"/>
      <rect x="18" y="14" width="10" height="28" rx="4" fill="#e9d5ff" transform="rotate(-35 23 28)" />
      <rect x="32" y="14" width="10" height="28" rx="4" fill="#c084fc" transform="rotate(-35 37 28)" />
      <text x="84" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" fill="#ffffff" letter-spacing="-0.02em">FliTools</text>
      <text x="215" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="22" fill="#c084fc">.cyou</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="150" font-family="system-ui, -apple-system, sans-serif" font-weight="300" font-size="54" fill="#ffffff" letter-spacing="-0.03em">
      Free, 100% Client-Side
    </text>
    <text x="0" y="220" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="54" fill="#e9d5ff" letter-spacing="-0.03em">
      Digital Utilities & Media Hub
    </text>

    <!-- Subtext -->
    <text x="0" y="280" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#d8b4fe">
