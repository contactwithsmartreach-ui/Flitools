    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 335)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="#2d0f55" stroke="#7e22ce" stroke-width="1.5"/>
      <text x="90" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="15" fill="#e9d5ff" text-anchor="middle">🔒 Zero Uploads</text>

      <rect x="195" y="0" width="190" height="42" rx="21" fill="#2d0f55" stroke="#7e22ce" stroke-width="1.5"/>
      <text x="290" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="15" fill="#e9d5ff" text-anchor="middle">⚡ Instant Execution</text>

      <rect x="400" y="0" width="180" height="42" rx="21" fill="#2d0f55" stroke="#7e22ce" stroke-width="1.5"/>
      <text x="490" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="15" fill="#e9d5ff" text-anchor="middle">🌐 100% In-Browser</text>
